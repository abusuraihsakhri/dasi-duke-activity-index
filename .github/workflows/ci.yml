name: Dasi Duke Activity Index CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_SECRET_KEY: test-only-key-not-for-production
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'pydantic>=2,<3' 'pytest>=8,<10'

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "

    - name: Docker image build and DASI CLI smoke test
      if: matrix.python-version == '3.12'
      run: |
        docker build -t dasi-duke-activity-index:test .
        docker run --rm dasi-duke-activity-index:test python dasi_index.py single --dasi-score 58.2
