name: Publish DASI web calculator
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live published page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" -o /tmp/dasi-live.html; then
              if grep -q 'Duke Activity Status Index' /tmp/dasi-live.html && grep -q 'const activities = ' /tmp/dasi-live.html && grep -q 'id="dasi-form"' /tmp/dasi-live.html; then
                echo "Published questionnaire available: $PAGE_URL"
                exit 0
              fi
            fi
            sleep 4
          done
          echo "Published page did not return the expected questionnaire" >&2
          exit 1
